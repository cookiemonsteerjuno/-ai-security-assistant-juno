    <meta property="og:title" content="Sentinel AI Assistant">
    <meta property="og:description" content="A high-security AI dashboard and chat interface featuring real-time integrity monitoring, Cloudflare incoming packet drop shield, zero analytics logging blocker, zero node access defense, foreign states geoblocking, Bluetooth pairing kill-switch, network sharing request blocker, anti-packet inspection, 1-minute firewall reload engine, and autonomous location changing.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }
        body.light-mode {
            color: #0f172a;
        }
        .mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .light-mode .glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .shadow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }
        .shadow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }
        /* Custom animations for the UI elements */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fade-in-up 0.4s ease-out forwards;
        }
        [data-sensitive-data="true"] {
            transition: filter 150ms cubic-bezier(0.16, 1, 0.3, 1), opacity 150ms ease;
        }
        [data-screen-masked="true"] [data-sensitive-data="true"] {
            filter: blur(10px) brightness(0.85) !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            pointer-events: none !important;
        }
        @media (prefers-reduced-motion: reduce) {
            [data-sensitive-data="true"] {
                transition: none;
            }
        }
    </style>
