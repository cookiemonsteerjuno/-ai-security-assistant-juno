I name: Build Sentinel AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q SentinelAI_Android_No_Studio.zip -d android-src
          PROJECT_FILE="$(find android-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find Android Gradle project."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
l I 
      - name: Align Kotlin JVM target with Java
        run: |
          cat > "$PROJECT_DIR/jvm-target.init.gradle" <<'EOF'
          allprojects {
      l       afterEvaluate {
              tasks.matching { it.name.toLowerCase().contains("kotlin") && it.hasProperty("kotlinOptions") }.configureEach {
                kotlinOptions.jvmTarget = "1.8"
              }
            }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon -I "$GITHUB_WORKSPACE/$PROJECT_DIR/jvm-target.init.gradle" -p "$GITHUB_WORKSPACE/$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-debug-apk
          path: android-src/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error